[ligar]

; ---------- Ramais simples ----------
exten => 0800,1,Answer()
 same => n,Dial(SIP/pedro)
 same => n,Hangup()

exten => 0900,1,Answer()
 same => n,Dial(SIP/maria,30,r)
 same => n,Hangup()

; ---------- URA ----------
exten => 5000,1,Answer()
 same => n,Set(TENTATIVAS=0)
 same => n,Wait(1)
 same => n,AGI(googletts.agi,"Seja bem-vindo ao I F P B",pt-BR)
 same => n(ini),Set(TENTATIVAS=$[${TENTATIVAS}+1])
 same => n,GotoIf($[${TENTATIVAS} > 3]?fim)
 same => n,AGI(googletts.agi,"Por favor, digite a sua matrícula",pt-BR)
 same => n,Read(MATRICULA,,11,,1,3333333333333333333333333333330)
 same => n,AGI(checkmatricula.agi,${MATRICULA})
 same => n,GotoIf($["${MATRICULASTATUS}" = "1"]?ok:err)
 same => n(ok),AGI(googletts.agi,"Olá ${MATRICULAMESSAGE}, escolha uma das opções",pt-BR)
 same => n,MusicOnHold()
 same => n,Hangup()
 same => n(err),AGI(googletts.agi,"Matrícula não encontrada. Digite novamente",pt-BR)
 same => n,Goto(ini)
 same => n(fim),Hangup()
exten => 5001,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
exten => 5002,1,Answer()
 same => n,Read(TESTE,beep,3,,1,15)
 same => n,NoOp(Digitou: ${TESTE})
 same => n,SayDigits(${TESTE})
 same => n,Hangup()
